<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kios Siswa — Kantin Imbos</title>
<link rel="icon" type="image/png" href="/img/logo-imbos.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<!-- Layar kios di depan reader: dipakai bergantian oleh banyak siswa, tanpa
     login dan tanpa cookie. Semua isi dibentuk kios.js sesuai layar aktif. -->
<body class="kios">

<div id="k-layar"></div>

<!-- Gembok mode kios. Di luar #k-layar karena render() menimpa seluruh isi
     layar, sedangkan gembok harus bertahan apa pun layar yang sedang aktif. -->
<div id="k-gembok" class="hidden"></div>

<!-- Kotak tersembunyi penampung ketikan reader (reader HID = papan ketik) -->
<div id="toast"></div>

<script src="/uang.js"></script>
<script src="/kios.js"></script>
</body>
</html>
